name: Two-exchange comparison research (no trading)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"
permissions:
  contents: read
  actions: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe one shared NBA event (read only)
        run: python one_event_discovery.py
      - name: Probe event contract books (read only)
        run: python one_event_book_probe.py
      - name: Build opposing research pair combinations
        run: python one_event_pair_combinations.py
      - name: Capture Kalshi public market metadata
        run: python capture_kalshi.py --limit 100 --max-pages 10
      - name: Capture targeted Kalshi sports series
        run: python kalshi_sports_capture.py
      - name: Capture Polymarket public market metadata
        run: python polymarket_public.py --limit 100 --max-pages 10
      - name: Find titles requiring human resolution-rule review
        run: |
          K="kalshi_sports_snapshot.json"
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python market_comparison.py --kalshi "$K" --polymarket "$P" --max-results 500 --output research_matches.json
      - name: Diagnose Polymarket public CLOB access without bypasses
        run: python clob_access_diagnostic.py
      - name: Screen multi-market indicative outcome candidates (no executable quote)
        run: |
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python indicative_candidate_screen.py --matches research_matches.json --polymarket "$P" --output indicative_candidate_screen.json
      - name: Shortlist multi-event sports candidates for manual review
        run: python sports_candidate_shortlist.py
      - name: Group sporting candidate leads by event identifiers
        run: python sports_event_leads.py
      - name: Diagnose discovery coverage and near-match examples
        run: |
          K="kalshi_sports_snapshot.json"
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python discovery_diagnostic.py --kalshi "$K" --polymarket "$P" --output discovery_diagnostic.json
      - name: Sample candidate public order books (research only)
        run: python opposing_token_map.py --matches research_matches.json --output opposing_token_map.json
      - name: Diagnose cross-league sports discovery funnel
        run: |
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python sports_discovery_funnel.py --kalshi kalshi_sports_snapshot.json --polymarket "$P" --matches research_matches.json --mapping opposing_token_map.json --output sports_discovery_funnel.json
      - name: Sample mapped game-winner orderbooks (bounded research)
        run: python candidate_orderbooks.py --matches research_matches.json --opposing-token-map opposing_token_map.json --max-pairs 20 --output candidate_orderbooks.json
      - name: Screen displayed depth with explicit fee input gate
        run: python depth_fee_screen.py --books candidate_orderbooks.json --output depth_fee_screen.json
      - name: Illustrative NBA fee-and-buffer sensitivity (mapped outcome candidates, not verified rules)
        run: python depth_fee_screen.py --books candidate_orderbooks.json --opposing-token-map opposing_token_map.json --poly-rate 0.05 --kalshi-multiplier 1 --extra-cost 0.25 --budget 5000 --per-venue-budget 2500 --output depth_fee_illustrative.json
      - name: Diagnose raw spread versus modeled friction
        run: python opportunity_economics.py --input depth_fee_illustrative.json --output opportunity_economics.json
      - name: Rank closest fee-adjusted research watchlist
        run: python near_miss_watchlist.py --input depth_fee_illustrative.json --output near_miss_watchlist.json
      - name: Compare with most recent successful watchlist (read only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS="$(gh run list --workflow market_comparison.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "${{ github.run_id }}" ]; then
            echo "No earlier successful research run; trend comparison skipped."
            exit 0
          fi
          mkdir -p previous_research
          if gh run download "$PREVIOUS" --name "cross-exchange-research-$PREVIOUS" --dir previous_research; then
            if [ -f previous_research/opportunity_economics.json ] && [ -f opportunity_economics.json ]; then
              python league_quote_quality_trends.py --previous previous_research/opportunity_economics.json --current opportunity_economics.json --output league_quote_quality_trends.json
            fi
            if [ -f previous_research/near_miss_watchlist.json ]; then
              python watchlist_trends.py --previous previous_research/near_miss_watchlist.json --current near_miss_watchlist.json --output watchlist_trends.json
              if [ -f previous_research/watchlist_trends.json ]; then
                python near_break_even_history.py --previous previous_research/watchlist_trends.json --current watchlist_trends.json --output watchlist_trends.json
              fi
            else
              echo "Previous run has no watchlist artifact."
            fi
          else
            echo "Previous artifact unavailable; skipping trends."
          fi
      - name: Check three-run sustained improvement (read only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS="$(gh run list --workflow market_comparison.yml --status success --limit 2 --json databaseId --jq '.[].databaseId')"
          mkdir -p history_runs
          COUNT=0
          for ID in $IDS; do
            if gh run download "$ID" --name "cross-exchange-research-$ID" --dir "history_runs/$ID" && [ -f "history_runs/$ID/near_miss_watchlist.json" ]; then
              if [ "$COUNT" = "0" ]; then PREV="history_runs/$ID/near_miss_watchlist.json"; else OLDEST="history_runs/$ID/near_miss_watchlist.json"; fi
              COUNT=$((COUNT+1))
            fi
          done
          if [ "$COUNT" = "2" ]; then
            python sustained_watchlist.py --oldest "$OLDEST" --previous "$PREV" --current near_miss_watchlist.json --output sustained_watchlist.json
          else
            echo "Insufficient saved history; three-run comparison skipped."
          fi
      - name: Review three-run league quote quality (read only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS="$(gh run list --workflow market_comparison.yml --status success --limit 8 --json databaseId --jq '.[].databaseId')"
          mkdir -p quality_history
          COUNT=0
          for ID in $IDS; do
            if gh run download "$ID" --name "cross-exchange-research-$ID" --dir "quality_history/$ID" && [ -f "quality_history/$ID/opportunity_economics.json" ]; then
              if [ "$COUNT" = "0" ]; then PREV="quality_history/$ID/opportunity_economics.json"; fi
              if [ "$COUNT" = "1" ]; then OLDEST="quality_history/$ID/opportunity_economics.json"; fi
              COUNT=$((COUNT+1))
            fi
            if [ "$COUNT" = "2" ]; then break; fi
          done
          if [ "$COUNT" = "2" ] && [ -f opportunity_economics.json ]; then
            python league_three_run_quality.py --oldest "$OLDEST" --previous "$PREV" --current opportunity_economics.json --min-pairs 3 --output league_three_run_quality.json
          else
            echo "Insufficient previous research artifacts for three-run quality check."
          fi
      - name: Generate unverified settlement rule review records
        run: |
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python settlement_rule_review.py --mapping opposing_token_map.json --kalshi kalshi_sports_snapshot.json --polymarket "$P" --output settlement_rule_review.json
      - name: Flag settlement rule wording differences for manual review
        run: python settlement_rule_triage.py --input settlement_rule_review.json --output settlement_rule_triage.json
      - name: Audit public orderbook evidence quality
        run: python orderbook_quality.py --input candidate_orderbooks.json --output orderbook_quality.json
      - name: Summarize evidence readiness
        run: |
          K="kalshi_sports_snapshot.json"
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          python readiness_report.py --kalshi "$K" --polymarket "$P" --output readiness_report.json
      - name: Produce phase-one real-data test report
        run: python phase1_real_data.py --matches research_matches.json --quality orderbook_quality.json --output phase1_real_data_report.json
      - name: Check observation evidence readiness
        run: |
          python preflight_gate.py --matches research_matches.json --books candidate_orderbooks.json --quality orderbook_quality.json --report phase1_real_data_report.json --output preflight_report.json
      - name: Publish compact research run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["## Crypto Junction — Phase 1 research run", "",
                   "**Not a trading signal or profitability backtest.**", ""]
          for name, fields in (
              ("phase1_real_data_report.json",
               ("title_match_candidates", "orderbook_candidates_sampled",
                "paired_books_collected", "timestamp_aligned_candidates",
                "displayed_depth_on_both_venues", "api_errors")),
              ("preflight_report.json", ("observation_usable", "issues")),
              ("one_event_book_probe.json", ("status", "both_event_apis_returned", "rule_equivalence_verified")),
              ("one_event_pair_combinations.json", ("status", "net_roi_verified")),
              ("sports_candidate_shortlist.json", ("sports_candidates_returned", "verified_paired_opportunities")),
              ("sports_event_leads.json", ("groups_found", "skipped_missing_identifiers", "verified_pairs")),
              ("indicative_candidate_screen.json", ("status", "candidate_outcomes")),
              ("clob_access_diagnostic.json", ("access_conclusion", "requests")),
              ("depth_fee_screen.json", ("status", "candidate_scenarios", "net_profit_verified")),
              ("depth_fee_illustrative.json", ("status", "candidate_scenarios", "net_profit_verified")),
              ("opportunity_economics.json", ("fixed_ten_pairs_analyzed", "counts", "by_league")),
              ("watchlist_trends.json", ("comparable_pairs",)),
              ("settlement_rule_review.json", ("verified_pairs", "records_with_both_rule_texts", "rule_equivalence_verified")),
              ("settlement_rule_triage.json", ("records_examined", "records_with_text_mention_differences", "verified_pairs")),
              ("sports_discovery_funnel.json", ("polymarket_markets_sampled", "matches_candidate_cap_reached", "by_league")),
              ("discovery_diagnostic.json", ("sports_keyword_markets", "near_match_candidate_count", "kalshi_coverage_complete", "polymarket_coverage_complete"))):
              try:
                  data = json.loads(Path(name).read_text(encoding="utf-8"))
                  lines.append("### " + name)
                  for key in fields:
                      lines.append("- " + key.replace("_", " ") + ": " + str(data.get(key)))
              except (OSError, ValueError) as exc:
                  lines.append("- " + name + ": unavailable (" + type(exc).__name__ + ")")
          lines.append("")
          try:
              event=json.loads(Path("one_event_book_probe.json").read_text(encoding="utf-8"))
              lines.extend(["", "### One-game evidence", 
                            "- Kalshi contracts: " + str([c.get("ticker") for c in event.get("kalshi_contracts",[])]),
                            "- Polymarket contracts: " + str([c.get("id") for c in event.get("polymarket_contracts",[])]),
                            "- Book observations: " + str(len(event.get("book_probes",[]))),
                            "- Event API errors: " + str(event.get("event_api_errors",[])),
                            "- Book errors: " + str(event.get("errors",[])), ""])
          except (OSError,ValueError):
              lines.append("One-game evidence report unavailable.")
          try:
              funnel = json.loads(Path("sports_discovery_funnel.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Discovery bottleneck by league",
                            "| League | Discovered | Matched | Mapped | Match % | Mapping % | Bottleneck |",
                            "|---|---:|---:|---:|---:|---:|---|"])
              for league, row in funnel.get("by_league", {}).items():
                  def pct(value):
                      return "n/a" if value is None else str(value) + "%"
                  lines.append("| " + str(league) + " | " +
                               " | ".join(str(row.get(key, 0)) for key in (
                                   "kalshi_contract_sides_discovered",
                                   "exact_identifier_matched_sides",
                                   "strict_opposing_token_mapped_sides")) + " | " +
                               pct(row.get("identifier_coverage_pct_of_discovered_sides")) + " | " +
                               pct(row.get("mapping_coverage_pct_of_matched_sides")) + " | " +
                               str(row.get("discovery_bottleneck", "UNKNOWN")) + " |")
              priorities = funnel.get("research_priorities", [])
              lines.append("")
              lines.append("### Largest research coverage gaps")
              if priorities:
                  for item in priorities[:5]:
                      lines.append("- " + str(item.get("league")) + " / " +
                                   str(item.get("stage")) + ": " +
                                   str(item.get("missing_sides")) +
                                   " unmatched contract sides (not trading opportunities)")
              else:
                  lines.append("- No unmatched sports contract sides in the collected sample; pricing and rule verification remain outstanding.")
              if funnel.get("matches_candidate_cap_reached"):
                  lines.append("**Coverage warning:** Candidate comparison reached its configured cap.")
              if funnel.get("polymarket_coverage_complete") is not True:
                  lines.append("**Coverage warning:** Polymarket pagination is incomplete or unverified.")
              lines.append("Mapping counts are research-only; settlement rules, depth, fees and executable opportunities are not verified.")
          except (OSError, ValueError, TypeError) as exc:
              lines.append("Discovery bottleneck summary unavailable (" + type(exc).__name__ + ").")
          try:
              economics = json.loads(Path("opportunity_economics.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Pricing and quote quality by league (fixed-ten research)",
                            "| League | Priced | Quote screen passed | Pass rate | Quote unverified | Raw spread nonpositive | Friction erased |",
                            "|---|---:|---:|---:|---:|---:|---:|"])
              for league, row in economics.get("by_league", {}).items():
                  rate = row.get("quote_quality_pass_rate_pct")
                  lines.append("| " + str(league) + " | " +
                               str(row.get("pairs", 0)) + " | " +
                               str(row.get("quality_screen_passed_pairs", 0)) + " | " +
                               (str(rate) + "%" if rate is not None else "n/a") + " | " +
                               " | ".join(str(row.get(field, 0)) for field in (
                                   "quality_screen_unverified_pairs",
                                   "nonpositive_raw_spread_pairs", "friction_erased_pairs")) + " |")
              lines.append("Only priced fixed-ten observations are counted; missing/depth-limited quotes are not included. Quality screens do not verify execution or settlement.")
          except (OSError, ValueError, TypeError) as exc:
              lines.append("Pricing and quote quality summary unavailable (" + type(exc).__name__ + ").")
          try:
              collection = json.loads(Path("candidate_orderbooks.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Pre-pricing book collection diagnostics",
                            "- Eligible but unsampled candidates: " + str(collection.get("unsampled_eligible_candidates", "unknown")),
                            "| League | Missing identifiers | Both books missing | Kalshi missing | Polymarket missing | Partial token failures | Books collected |",
                            "|---|---:|---:|---:|---:|---:|---:|"])
              fields = ("MISSING_IDENTIFIERS", "BOTH_VENUE_BOOKS_MISSING",
                        "KALSHI_BOOK_MISSING", "POLYMARKET_BOOK_MISSING",
                        "PARTIAL_TOKEN_FETCH_FAILURE", "BOOKS_COLLECTED_UNVERIFIED")
              for league, counts in collection.get("collection_diagnostics_by_league", {}).items():
                  lines.append("| " + str(league) + " | " +
                               " | ".join(str(counts.get(field, 0)) for field in fields) + " |")
              lines.append("Book collection does not establish adequate depth, synchronized quotes, fees or rule equivalence.")
          except (OSError, ValueError, TypeError) as exc:
              lines.append("Book collection diagnostics unavailable (" + type(exc).__name__ + ").")
          try:
              trend = json.loads(Path("league_quote_quality_trends.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Quote quality changes versus previous successful research snapshot",
                            "| League | Earlier sample | Current sample | Sample change % | Earlier pass % | Current pass % | Change (pp) |",
                            "|---|---:|---:|---:|---:|---:|---:|"])
              for league, row in trend.get("by_league", {}).items():
                  def display(value):
                      return "n/a" if value is None else str(value)
                  lines.append("| " + str(league) + " | " +
                               " | ".join(display(row.get(field)) for field in (
                                   "previous_pairs", "current_pairs", "sample_change_pct",
                                   "previous_pass_rate_pct", "current_pass_rate_pct", "change_percentage_points")) + " |")
              lines.append("Two snapshots are insufficient to establish a consistent trend or profitable opportunities.")
          except (OSError, ValueError, TypeError):
              lines.append("Quote quality trend comparison unavailable; no improvement inferred.")
          try:
              three = json.loads(Path("league_three_run_quality.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Three-run league quote quality (descriptive only)",
                            "| League | Priced observations per run | Pass rates % | Positive raw spreads by run | Positive in all 3 | Minimum sample met | Strictly improving |",
                            "|---|---|---|---|---|---|---|"])
              for league, row in three.get("by_league", {}).items():
                  lines.append("| " + str(league) + " | " +
                               str(row.get("pairs_by_run", [])) + " | " +
                               str(row.get("pass_rates_pct_by_run", [])) + " | " +
                               str(row.get("positive_raw_spread_pairs_by_run", [])) + " | " +
                               str(row.get("positive_raw_spread_in_every_run", False)) + " | " +
                               str(row.get("minimum_samples_met", False)) + " | " +
                               str(row.get("three_run_improvement_observed", False)) + " |")
              lines.append("Trend observations do not verify trading eligibility, settlement rules, or executable prices.")
          except (OSError, ValueError, TypeError):
              lines.append("Three-run quote-quality results unavailable or history insufficient.")
          try:
              illustrated = json.loads(Path("depth_fee_illustrative.json").read_text(encoding="utf-8"))
              lines.append("- FX cost: " + ("explicit estimate supplied" if illustrated.get("fx_cost_supplied") else "UNKNOWN / assumed $0 for illustration only"))
              if not illustrated.get("fx_cost_supplied"):
                  lines.append("**Cost completeness warning:** Positive modeled net ROI is not verified after currency conversion.")
              tiers = {"SMALL_POSITIVE":0, "HIGHER_PRIORITY_0_5_PLUS":0, "EXCEPTIONAL_2_PLUS":0}
              for candidate in illustrated.get("rows", []):
                  tier = candidate.get("scenario", {}).get("net_roi_tier")
                  if tier in tiers:
                      tiers[tier] += 1
              lines.extend(["", "### Revised positive-net ROI research tiers (not executable)",
                            "- Small positive (above 0%, below 0.5%): " + str(tiers["SMALL_POSITIVE"]),
                            "- Higher priority (0.5% to below 2%): " + str(tiers["HIGHER_PRIORITY_0_5_PLUS"]),
                            "- Exceptional (2% or greater): " + str(tiers["EXCEPTIONAL_2_PLUS"]),
                            "- $5,000 combined and $2,500 per-venue research ceilings. Unknown FX/extra funding location is conservatively reserved on each venue, but counted only once in modeled combined costs. Fee schedules, funding assignment, FX and trading eligibility remain unverified."])
          except (OSError, ValueError, TypeError):
              lines.append("Positive-net ROI tier counts unavailable.")
          try:
              watchlist = json.loads(Path("near_miss_watchlist.json").read_text(encoding="utf-8"))
              lines.extend(["", "### Research shortlist cost evidence",
                            "- Modeled cost inputs present (still unverified): " + str(watchlist.get("cost_inputs_complete_for_model_count", 0)),
                            "- Hypothetical positive but cost inputs incomplete: " + str(watchlist.get("positive_but_cost_incomplete_count", 0)),
                            "- Neither status verifies actual fees, FX rates, market resolution or fills."])
          except (OSError, ValueError, TypeError):
              lines.append("Research shortlist cost evidence unavailable.")
          try:
              depth = json.loads(Path("depth_fee_illustrative.json").read_text(encoding="utf-8"))
              positives = depth.get("rows", [])
              different = sum(x.get("sizing_comparison", {}).get("different_optimal_quantities") is True for x in positives)
              lines.extend(["", "### Position size: modeled dollar profit versus ROI",
                            "- Hypothetical positive modeled scenarios: " + str(len(positives)),
                            "- Different max-dollar-profit versus max-ROI sizes: " + str(different),
                            "- Position sizing uses sampled displayed depth up to $5,000 total; neither optimum is a verified executable opportunity."])
          except (OSError, ValueError, TypeError):
              lines.append("Sizing comparison unavailable.")
          try:
              assumptions = json.loads(Path("depth_fee_illustrative.json").read_text(encoding="utf-8"))
              lines.append("- Research funding assignments: " + str(assumptions.get("cost_funding_assignments", "unknown")))
              lines.append("- Each unknown cost remains reserved on both venues for funding checks, but is counted once in modeled profit.")
          except (OSError, ValueError, TypeError):
              lines.append("Funding assignment assumptions unavailable.")
          lines.append("**Verified opportunities: 0. Realized profit: not established.**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Validate research logic
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-exchange-research-${{ github.run_id }}
          path: |
            snapshots/*.json
            kalshi_sports_snapshot.json
            research_matches.json
            sports_candidate_shortlist.json
            sports_event_leads.json
            discovery_diagnostic.json
            sports_discovery_funnel.json
            readiness_report.json
            candidate_orderbooks.json
            depth_fee_screen.json
            depth_fee_illustrative.json
            opportunity_economics.json
            league_quote_quality_trends.json
            league_three_run_quality.json
            near_miss_watchlist.json
            watchlist_trends.json
            sustained_watchlist.json
            opposing_token_map.json
            settlement_rule_review.json
            settlement_rule_triage.json
            orderbook_quality.json
            phase1_real_data_report.json
            preflight_report.json
            one_event_discovery.json
            one_event_book_probe.json
            one_event_pair_combinations.json
            indicative_candidate_screen.json
            clob_access_diagnostic.json
          retention-days: 14
          if-no-files-found: warn

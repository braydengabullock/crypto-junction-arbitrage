name: Recover archived 24-hour observation report (read only)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed observation run ID containing six window artifacts'
        required: true
        default: '41131033111'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  recover_report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore six existing observation windows (no new collection)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          mkdir -p observation_all
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'observation-window-*' --dir observation_all
      - name: Verify archived observations
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            test -d "observation_all/observation-window-$n"
            test -n "$(find "observation_all/observation-window-$n" -name '*.json' -path '*/observation_window_*/*' -print -quit)"
          done
      - name: Replay saved observations
        run: |
          set -euo pipefail
          python local_historical_backtest.py --archive-dir observation_all --output-dir observation_final | tee observation_final_summary.json
      - name: Preserve recovered final analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-observation-final-report
          path: |
            observation_final/*.json
            observation_final_summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish report
        if: always()
        run: |
          echo '### Recovered archived observation — research only' >> "$GITHUB_STEP_SUMMARY"
          if [ -f observation_final_summary.json ]; then cat observation_final_summary.json >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'No trades executed; non-atomic observations are not verified arbitrage.' >> "$GITHUB_STEP_SUMMARY"

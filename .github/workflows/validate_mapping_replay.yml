name: Validate mapping and replay saved five-cycle evidence
on:
  push:
    branches: [main]
    paths:\n      - '.github/workflows/validate_mapping_replay.yml'\n      - 'opposing_token_map.py'\n      - 'depth_fee_screen.py'\n      - 'historical_snapshot_replay.py'\n      - 'tests/test_mapping_collision_regression.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression and full unit suite
        run: python -m unittest discover -s tests -v
      - name: Retrieve original five-cycle archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p saved_trial
          gh run download 40801916817 --name controlled-collector-trial-40801916817 --dir saved_trial
          test "$(find saved_trial/controlled_trial_archives -name '*.json' | wc -l)" -eq 5
      - name: Replay original observations with updated pricing diagnostics
        run: |
          python local_historical_backtest.py --archive-dir saved_trial/controlled_trial_archives --output-dir validated_replay | tee replay_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("validated_replay/local_backtest_results.json").read_text())
          assert r["capture_count_accepted"]==5, "Five archived snapshots required"
          assert r["capture_count_rejected"]==0, "No snapshots may be silently dropped"
          assert r["pricing_diagnostics"], "Expected pricing diagnostics"
          print(json.dumps({"captures":r["capture_count_accepted"],
            "priced_scenarios":r["total_priced_pair_observations"],
            "positive_sightings":r["total_positive_candidate_observations"],
            "pricing_diagnostics":r["pricing_diagnostics"]},indent=2))
          PY
      - name: Summarize diagnostic outcome\n        if: always()\n        run: |\n          echo '### Five-cycle mapping and pricing validation' >> "$GITHUB_STEP_SUMMARY"\n          if [ -f validated_replay/local_backtest_results.json ]; then\n            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"\n          import json\n          r=json.load(open('validated_replay/local_backtest_results.json'))\n          print('Snapshots accepted:',r['capture_count_accepted'])\n          print('Priced scenarios:',r['total_priced_pair_observations'])\n          print('Positive modeled sightings:',r['total_positive_candidate_observations'])\n          print('Pricing diagnostics:',r['pricing_diagnostics'])\n          PY\n          else\n            echo 'Replay unavailable; inspect failed job steps.' >> "$GITHUB_STEP_SUMMARY"\n          fi\n      - name: Archive replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-mapping-replay-${{ github.run_id }}
          path: |
            replay_summary.json
            validated_replay/*.json
          if-no-files-found: warn
          retention-days: 14

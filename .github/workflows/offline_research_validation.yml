name: Offline research validation (no network data)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research Python modules and tests
        run: python -m compileall -q .
      - name: Run scanner regression tests without live market capture
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee offline_test_results.txt
          exit ${PIPESTATUS[0]}
      - name: Compare 30-pair offline worker performance (no network)
        run: |
          python collector_benchmark.py --pairs 30 --iterations 1 --interval-seconds 60 --latency-ms 100 --workers 1 --output collector_benchmark_1_worker.json
          python collector_benchmark.py --pairs 30 --iterations 1 --interval-seconds 60 --latency-ms 100 --workers 2 --output collector_benchmark_2_workers.json
          python collector_benchmark.py --pairs 30 --iterations 1 --interval-seconds 60 --latency-ms 100 --workers 4 --output collector_benchmark_4_workers.json
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-junction-offline-tests-${{ github.run_id }}
          path: |
            offline_test_results.txt
            collector_benchmark_*_workers.json
          if-no-files-found: warn
          retention-days: 14
      - name: Explain scope
        if: always()
        run: |
          echo '## Crypto Junction — offline validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks Python syntax and local unit tests only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does not verify live orderbooks, matching settlement rules, fees, or executable trades.' >> "$GITHUB_STEP_SUMMARY"

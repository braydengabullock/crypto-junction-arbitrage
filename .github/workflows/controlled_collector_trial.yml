name: Controlled high-frequency collector trial (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector and historical replay tests
        run: python -m unittest discover -s tests -v
      - name: Capture current public market metadata
        run: |
          python kalshi_sports_capture.py
          python polymarket_public.py --limit 100 --max-pages 10
      - name: Build fresh conservative candidate mapping
        run: |
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          test -n "$P"
          python market_comparison.py --kalshi kalshi_sports_snapshot.json --polymarket "$P" --max-results 500 --output research_matches.json
          python opposing_token_map.py --matches research_matches.json --output opposing_token_map.json
      - name: Run ONE bounded live read-only collector cycle
        run: |
          python continuous_book_collector.py --matches research_matches.json --mapping opposing_token_map.json --output-dir controlled_trial_archives --max-pairs 3 --workers 1 --interval-seconds 60 --iterations 1 | tee controlled_trial_output.txt
          python collector_health.py --archive-dir controlled_trial_archives | tee controlled_trial_health.json
          python local_historical_backtest.py --archive-dir controlled_trial_archives --output-dir controlled_trial_backtest | tee controlled_trial_backtest_summary.json
      - name: Explain trial scope
        if: always()
        run: |
          echo '### One-cycle read-only public-data collector trial' >> "$GITHUB_STEP_SUMMARY"
          echo 'Maximum 3 mapped research candidates, one pass; NO account access or trading.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Stored market books are non-atomic and mapping settlement rules remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f controlled_trial_output.txt ]; then
            cat controlled_trial_output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Collector did not finish; no capture result may be inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-collector-trial-${{ github.run_id }}
          path: |
            controlled_trial_archives/*.json
            controlled_trial_output.txt
            controlled_trial_health.json
            controlled_trial_backtest_summary.json
            controlled_trial_backtest/*.json
            research_matches.json
            opposing_token_map.json
          if-no-files-found: warn
          retention-days: 14

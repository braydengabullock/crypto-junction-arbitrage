name: Polymarket public research history
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture public indicative market metadata
        run: python polymarket_public.py --limit 100 --max-pages 5
      - name: Preserve timestamped read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-research-${{ github.run_id }}
          path: snapshots/polymarket_*.json
          retention-days: 14
          if-no-files-found: error

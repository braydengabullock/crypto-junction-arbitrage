name: Live Kalshi connectivity (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public market sample (no keys, no orders)
        run: python live_kalshi_check.py

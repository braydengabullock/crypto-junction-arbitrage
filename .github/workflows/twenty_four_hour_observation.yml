name: 24-hour public orderbook observation (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: twenty-four-hour-public-observation
  cancel-in-progress: false
jobs:
  window_1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate research code
        run: python -m unittest discover -s tests -v
      - name: Refresh public metadata and research mapping
        run: |
          python kalshi_sports_capture.py
          python polymarket_public.py --limit 100 --max-pages 10
          P="$(find snapshots -maxdepth 1 -name 'polymarket_*.json' -print -quit)"
          test -n "$P"
          python market_comparison.py --kalshi kalshi_sports_snapshot.json --polymarket "$P" --max-results 500 --output research_matches.json
          python opposing_token_map.py --matches research_matches.json --output opposing_token_map.json
      - name: Save immutable research mapping for all windows
        uses: actions/upload-artifact@v4
        with:
          name: observation-mapping
          path: |
            research_matches.json
            opposing_token_map.json
          if-no-files-found: error
          retention-days: 14
      - name: Collect four-hour window 1 (read only)
        run: |
          set -euo pipefail
          mkdir -p observation_window_1
          python continuous_book_collector.py --matches research_matches.json --mapping opposing_token_map.json --output-dir observation_window_1 --max-pairs 30 --workers 2 --interval-seconds 60 --iterations 240 | tee observation_window_1.log
      - name: Inspect window 1 evidence
        if: always()
        run: |
          set -euo pipefail
          python collector_health.py --archive-dir observation_window_1 > observation_window_1_health.json
          cat observation_window_1_health.json
      - name: Build window 1 profitability replay
        if: always()
        run: |
          if [ -d observation_window_1 ]; then python local_historical_backtest.py --archive-dir observation_window_1 --output-dir observation_window_1_backtest > observation_window_1_backtest_summary.json; fi
      - name: Preserve window 1 checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-window-1
          path: |
            observation_window_1/*.json
            observation_window_1.log
            observation_window_1_health.json
            observation_window_1_backtest_summary.json
            observation_window_1_backtest/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish window 1 progress summary
        if: always()
        run: |
          echo '### Window 1 of 6 — public research only' >> "$GITHUB_STEP_SUMMARY"
          if [ -f observation_window_1_health.json ]; then cat observation_window_1_health.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f observation_window_1_backtest_summary.json ]; then cat observation_window_1_backtest_summary.json >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'Snapshots are not atomic and market settlement equivalence is unverified.' >> "$GITHUB_STEP_SUMMARY"
